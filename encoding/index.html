<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="darkreader-lock" /><title>Encoding</title><link rel="icon" type="image/svg+xml" href="../favicon-light.svg" media="(prefers-color-scheme: light)" /><link rel="alternate icon" type="image/png" href="../favicon-light.png" media="(prefers-color-scheme: light)" /><link rel="icon" type="image/svg+xml" href="../favicon-dark.svg" media="(prefers-color-scheme: dark)" /><link rel="alternate icon" type="image/png" href="../favicon-dark.png" media="(prefers-color-scheme: dark)" /><link rel="stylesheet" href="../monaco/editor.main.css" /><link rel="stylesheet" href="style.css" /><script type="module" src="script.js" defer></script></head><body><div class="panel" id="left-side"><div class="header"><div class="title">Unicode</div><button class="settings"><ul class="options shift"><li class="option"><input type="checkbox" id="ascii" name="ascii" checked /><label for="ascii">Encode ASCII</label></li><li class="option"><input type="checkbox" id="whitespace" name="whitespace" checked /><label for="whitespace">Encode Whitespace</label></li></ul></button></div><div id="unicode"></div></div><div id="right-side"><div class="panel"><div class="header"><div class="title">Base64</div><button class="maximize shift"></button></div><div id="base64"></div></div><div class="panel"><div class="header"><div class="title">UTF-8</div><button class="settings"><ul class="options"><li class="option"><input type="text" id="utf8-format" name="utf8-format" value="\x[HEX]" maxlength="25" autocomplete="off" /><label for="utf8-format">Format</label></li></ul></button><button class="maximize shift"></button></div><div id="utf8"></div></div><div class="panel"><div class="header"><div class="title">URI</div><button class="settings"><ul class="options"><li class="option"><input type="text" id="uri-format" name="uri-format" value="%[HEX]" maxlength="25" autocomplete="off" /><label for="uri-format">Format</label></li></ul></button><button class="maximize shift"></button></div><div id="uri"></div></div><div class="panel"><div class="header"><div class="title">UTF-16</div><button class="settings"><ul class="options"><li class="option"><input type="text" id="utf16-format" name="utf16-format" value="\u[HEX]" maxlength="25" autocomplete="off" /><label for="utf16-format">Format</label></li><li class="option"><select name="utf16-endian" id="utf16-endian"><option value="big">Big</option><option value="little">Little</option></select><label for="utf16-endian">Endian</label></li></ul></button><button class="maximize shift"></button></div><div id="utf16"></div></div><div class="panel"><div class="header"><div class="title">HTML</div><button class="maximize shift"></button></div><div id="html"></div></div><div class="panel"><div class="header"><div class="title">UTF-32</div><button class="settings"><ul class="options"><li class="option"><input type="text" id="utf32-format" name="utf32-format" value="\U[HEX]" maxlength="25" autocomplete="off" /><label for="utf32-format">Format</label></li><li class="option"><select name="utf32-endian" id="utf32-endian"><option value="big">Big</option><option value="little">Little</option></select><label for="utf32-endian">Endian</label></li></ul></button><button class="maximize shift"></button></div><div id="utf32"></div></div></div></body></html>
